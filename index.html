
<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instagram Style Demo</title>
<style>
body{
 margin:0;
 background:white;
 font-family:Arial,sans-serif;
 text-align:center;
}
.container{
 max-width:350px;
 margin:55px auto;
 padding:20px;
}
.logo{
 width:75px;
 height:75px;
 border:6px solid #d62976;
 border-radius:23px;
 margin:20px auto;
 position:relative;
 box-sizing:border-box;
}
.camera{
 width:31px;
 height:31px;
 border:5px solid #962fbf;
 border-radius:50%;
 position:absolute;
 top:16px;
 left:16px;
}
.dot{
 width:8px;
 height:8px;
 background:#feda75;
 border-radius:50%;
 position:absolute;
 right:10px;
 top:9px;
}
h1{
 font-family:cursive;
 font-size:38px;
 margin:20px;
}
input{
 width:100%;
 padding:14px;
 margin:5px 0;
 box-sizing:border-box;
 background:#fafafa;
 border:1px solid #ddd;
 border-radius:4px;
}
button{
 width:100%;
 padding:12px;
 background:#0095f6;
 color:white;
 border:0;
 border-radius:8px;
 margin-top:12px;
}
.meta{
 margin-top:65px;
 font-size:25px;
 font-weight:bold;
 color:#0866ff;
}
</style>
</head>
<body>
<div class="container">

<div class="logo">
<div class="camera"></div>
<div class="dot"></div>
</div>

<h1>Instagram</h1>

<input placeholder="Username or email">
<input type="password" placeholder="Password">

<button onclick="alert('Demo only!')">
Log in
</button>

<p>Forgot password?</p>

<div class="meta">Meta</div>
<p>Demo page — Not affiliated with Instagram</p>

</div>
</body>
</html>
